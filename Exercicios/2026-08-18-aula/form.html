<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Criativo - Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><strong>Luciano Simas Junior</strong></h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Voltar</a>
                </li>
                <li>
                    <button type="button" id="listar-livros">Listar Livros</button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="form-pai">
            <form action="#" method="post" id="formulario-livro">
                <label for="titulo">Titulo do Livro: </label>
                <input type="text" id="titulo" placeholder="Digite aqui...">
                <br>
                <label for="genero">Gênero do Livro: </label>
                <select id="genero">
                    <option value="acao">Ação</option>
                    <option value="suspense">Suspense</option>
                    <option value="romance">Romance</option>
                    <option value="romance">Ficção Ciêntifica</option>
                    <option value="romance">Aventura</option>
                </select>
                <br>
                <label for="nome-autor">Qual o nome do Autor?</label>
                <input type="text" name="nome-autor" id="nome-autor">
                <br>
                <label for="numero-paginas">O livro tem quantas páginas?</label>
                <input type="number" min="1">
                <br>
                <label for="numero-capitulos">O livro tem quantos capítulos?</label>
                <input type="number" min="1">
                <br>
                <label for="nota">Dê uma nota para o seu livro: </label>
                <input type="number" min="0" max="10" id="nota" step="0.1">
                <br>
                <label for="data-lancamento">Quando o livro foi lançado?</label>
                <input type="date" name="data-lancamento" id="data-lancamento">
                <br>
                <label for="recomendacao">Marque a caixa se recomendaria o livro:</label>
                <input type="checkbox" id="recomendacao" value="sim">
                <br>
                <button type="submit" id="button-submit">Enviar Formulário</button>
            </form>
        </div>
        <div id="lista-livros"></div>
    </main>
    <footer>
        <p>
            &copy; Projeto Front-End em desenvolvimento continuo.
        </p>
    </footer>
</body>
</html>
