<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Criativo - Formulário</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/web-data.png" type="image/x-icon">
</head>
<body>
    <header>
        <h1><strong>Luciano Simas Junior</strong></h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Voltar</a>
                </li>
                <li>
                    <button type="button" id="listar-livros">Listar Livros</button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="form-pai">
            <form action="#" method="post" id="formulario-livro">
                <label for="titulo">Titulo do Livro: </label>
                <input type="text" id="titulo" placeholder="Digite aqui...">
                <br>
                <label for="genero">Gênero do Livro: </label>
                <select id="genero">
                    <option value="acao">Ação</option>
                    <option value="suspense">Suspense</option>
                    <option value="romance">Romance</option>
                </select>
                <br>
                <label for="nota">Dê uma nota para o seu livro: </label>
                <input type="number" min="0" max="10" id="nota" step="0.01">
                <br>
                <button type="submit" id="button-submit">Enviar Formulário</button>
            </form>
        </div>
        <div id="lista-livros"></div>
    </main>
    <footer>
        <p>
            &copy; Projeto Front-End em desenvolvimento continuo.
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
